<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Страница не найдена — Максим Гусев</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      background: #FAF8F4; color: #1A1714;
      font-family: 'Jost', sans-serif; font-weight: 300; padding: 24px;
    }
    .eyebrow { font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: #A8845A; margin-bottom: 14px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(2.4rem, 6vw, 3.6rem); margin-bottom: 16px; }
    p { color: #5C5550; max-width: 440px; margin: 0 auto 32px; line-height: 1.7; }
    a.btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: #A8845A; color: #fff; text-decoration: none;
      font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 15px 30px; border-radius: 2px; transition: background 0.2s;
    }
    a.btn:hover { background: #C9A87C; }
  </style>
</head>
<body>
  <span class="eyebrow">Ошибка 404</span>
  <h1>Страница не найдена</h1>
  <p>Такой страницы не существует или она была перемещена. Вернитесь на главную — там есть вся информация об услугах и контакты.</p>
  <a class="btn" href="/">На главную</a>
</body>
</html>
